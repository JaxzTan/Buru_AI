# Local environment (docs/TRD_V3.md §8): PostgreSQL, Redis, Temporal dev server, Buru app.
# `make up` starts dependencies only; `docker compose --profile app up` also runs the app container.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buru
      POSTGRES_USER: buru
      POSTGRES_PASSWORD: buru
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "buru", "-d", "buru"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  temporal:
    image: temporalio/temporal:1.5.1
    # In-memory dev server: workflow history resets on restart.
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233" # gRPC
      - "8233:8233" # Web UI

  app:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      BURU_POSTGRES_URL: postgres://buru:buru@postgres:5432/buru?sslmode=disable
      BURU_REDIS_ADDR: redis:6379
      BURU_TEMPORAL_HOSTPORT: temporal:7233
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      temporal: { condition: service_started }

volumes:
  postgres-data:
