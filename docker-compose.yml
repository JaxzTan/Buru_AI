# Local environment (docs/TRD.md §8): PostgreSQL, Redis, Temporal dev server, Sockabus app + dashboard.
# `make up` starts dependencies only; `docker compose --profile app up` also runs the Go app and the web dashboard.
services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buru
      POSTGRES_USER: buru
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buru} # set in .env on the server (openssl rand -hex 24)
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "buru", "-d", "buru"]
      interval: 5s
      retries: 20

  redis:
    container_name: redis
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  temporal:
    container_name: temporal
    image: temporalio/temporal:1.5.1
    # In-memory dev server: workflow history resets on restart.
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233" # gRPC
      - "8233:8233" # Web UI

  app:
    container_name: app
    profiles: [app]
    build: .
    env_file: .env
    environment:
      SOCKABUS_POSTGRES_URL: postgres://buru:${POSTGRES_PASSWORD:-buru}@postgres:5432/buru?sslmode=disable
      SOCKABUS_REDIS_ADDR: redis:6379
      SOCKABUS_TEMPORAL_HOSTPORT: temporal:7233
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      temporal: { condition: service_started }

  web:
    container_name: web
    profiles: [app]
    build:
      context: ./web
      args:
        SOCKABUS_API_URL: http://app:8080 # browser calls /api/*, Next proxies to the app container
    environment:
      SOCKABUS_OPERATOR_TOKEN: ${SOCKABUS_OPERATOR_TOKEN:-} # added by the /api proxy, never sent to the browser
    ports: ["3000:3000"]
    depends_on: [app]

  # One-off: docker compose run --rm migrate (make deploy runs it before restarting the app).
  migrate:
    profiles: [tools]
    image: migrate/migrate:v4.19.1
    volumes: [./db/migrations:/migrations:ro]
    command: ["-path", "/migrations", "-database", "postgres://buru:${POSTGRES_PASSWORD:-buru}@postgres:5432/buru?sslmode=disable", "up"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
