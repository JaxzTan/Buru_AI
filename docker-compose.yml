# Local environment (docs/TRD.md §8): MySQL, Redis, Temporal dev server, Buru app.
# `make up` starts dependencies only; `docker compose --profile app up` also runs the app container.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: buru
      MYSQL_USER: buru
      MYSQL_PASSWORD: buru
    ports: ["3307:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  temporal:
    image: temporalio/temporal:1.5.1
    # In-memory dev server: workflow history resets on restart.
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233" # gRPC
      - "8233:8233" # Web UI

  app:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      BURU_MYSQL_DSN: buru:buru@tcp(mysql:3306)/buru?parseTime=true
      BURU_REDIS_ADDR: redis:6379
      BURU_TEMPORAL_HOSTPORT: temporal:7233
    ports: ["8080:8080"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      temporal: { condition: service_started }

volumes:
  mysql-data:
