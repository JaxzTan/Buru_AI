name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build -t sockabus:ci .

  db: # TRD §8: sqlc diff + vet, migrations up/down, integration tests on real PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: buru
          POSTGRES_USER: buru
          POSTGRES_PASSWORD: buru
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buru -d buru"
          --health-interval 5s
          --health-retries 20
    env:
      DB_URL: postgres://buru:buru@localhost:5432/buru?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - run: sqlc diff
      - run: sqlc vet
      - run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
      - run: migrate -path db/migrations -database "$DB_URL" up
      - run: migrate -path db/migrations -database "$DB_URL" down -all
      - run: migrate -path db/migrations -database "$DB_URL" up
      - run: go test -count=1 ./internal/db/
        env:
          SOCKABUS_TEST_POSTGRES_URL: ${{ env.DB_URL }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
